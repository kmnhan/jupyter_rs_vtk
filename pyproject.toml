[build-system]
requires = ["hatchling>=1.18", "hatch-jupyter-builder>=0.9"]
build-backend = "hatchling.build"

[project]
name = "jupyter_rs_vtk"
version = "0.2.0"
authors = [
    { name = "RadiaSoft LLC", email = "pip@pykern.org" },
]

[tool.hatch.build]
# include the built Jupyter frontend assets in the wheel
artifacts = [
  "jupyter_rs_vtk/labextension/**",
  "jupyter_rs_vtk/nbextension/**",
  "install.json",
  "jupyter_rs_vtk.json",
]

[tool.hatch.build.targets.wheel.shared-data]
"jupyter_rs_vtk/labextension" = "share/jupyter/labextensions/jupyter_rs_vtk"
"install.json" = "share/jupyter/labextensions/jupyter_rs_vtk/install.json"
"jupyter_rs_vtk/nbextension" = "share/jupyter/nbextensions/jupyter_rs_vtk"
"jupyter_rs_vtk.json" = "etc/jupyter/nbconfig/notebook.d/jupyter_rs_vtk.json"

[tool.hatch.build.hooks.jupyter-builder]
build-function = "hatch_jupyter_builder.npm_builder"
dependencies = ["jupyterlab>=4"]  # optional, only if you need it at build-time

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
npm = ["jlpm"]
path = "js"
build_cmd = "build:prod"
